<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explainers</title>
<meta name="description" content="Interactive, visual introductions to ideas worth understanding properly.">
<script>try{var t=localStorage.getItem('xp-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="assets/site.css">
<style>
:root{
  --bg:#faf8f4; --surface:#ffffff; --surface-2:#f2efe8; --ink:#1c1c1e; --ink-2:#4c4e55; --ink-3:#8b8d93; --line:#e3dfd5;
  --one:#16917c; --one-soft:rgba(22,145,124,.15);
  --zero:#d9573a; --zero-soft:rgba(217,87,58,.15);
  --accent:#3654c9; --accent-soft:rgba(54,84,201,.11);
  --gold:#b98317; --gold-soft:rgba(185,131,23,.22);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --surface:#1a1b1f; --surface-2:#24262b; --ink:#ececee; --ink-2:#b6b7bd; --ink-3:#7f8188; --line:#2f3137;
    --one:#3cc4ad; --one-soft:rgba(60,196,173,.18);
    --zero:#ff7f5e; --zero-soft:rgba(255,127,94,.18);
    --accent:#8095ff; --accent-soft:rgba(128,149,255,.14);
    --gold:#e2b04a; --gold-soft:rgba(226,176,74,.24);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --surface:#1a1b1f; --surface-2:#24262b; --ink:#ececee; --ink-2:#b6b7bd; --ink-3:#7f8188; --line:#2f3137;
  --one:#3cc4ad; --one-soft:rgba(60,196,173,.18);
  --zero:#ff7f5e; --zero-soft:rgba(255,127,94,.18);
  --accent:#8095ff; --accent-soft:rgba(128,149,255,.14);
  --gold:#e2b04a; --gold-soft:rgba(226,176,74,.24);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:0 auto;padding:0 20px 80px}
a{color:var(--accent)}
.home-hero{text-align:center;padding:56px 0 28px}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:13px;color:var(--ink-3);margin:0}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,6vw,3.2rem);margin:.2em 0 .3em}
.lede{font-size:1.15rem;color:var(--ink-2);max-width:600px;margin:0 auto}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:8px 0 6px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-3)}
.search:focus-within{border-color:var(--accent)}
.search svg{width:16px;height:16px;flex:none}
.search input{all:unset;flex:1;min-width:0;font:15px var(--sans);color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.views{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.views button{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font:14px var(--sans);color:var(--ink-2);cursor:pointer}
.views button svg{width:15px;height:15px}
.views button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.views button:focus-visible,.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.jump a{font-size:14px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2);text-decoration:none;background:var(--surface)}
.jump a:hover{border-color:var(--accent);color:var(--accent)}

.cat{padding-top:34px;scroll-margin-top:12px}
.cat > h2{font-size:clamp(1.6rem,4vw,2.1rem);margin:0 0 .25em}
.cat > .blurb{color:var(--ink-2);margin:0 0 6px;max-width:680px}
.group{margin-top:26px}
.group-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:4px}
.group-head h3{font-size:1.25rem;margin:0}
.group-head .meta{font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.group > .blurb{font-size:15px;color:var(--ink-2);margin:0 0 14px;max-width:680px}

/* cards view */
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.grid li{display:flex}
.card{flex:1;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{position:relative;aspect-ratio:16/10;background:var(--surface-2);border-bottom:1px solid var(--line)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font:600 2.4rem var(--serif);color:var(--ink-3)}
.part{position:absolute;top:10px;left:10px;font:600 12px var(--mono);padding:3px 9px;border-radius:999px;background:var(--accent);color:#fff}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-body h4{font:600 1.15rem/1.25 var(--serif);margin:0;color:var(--ink)}
.card:hover h4{color:var(--accent)}
.card-body p{font-size:14.5px;line-height:1.5;color:var(--ink-2);margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}

/* list view */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:grid;grid-template-columns:32px 1fr;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list.unordered li{grid-template-columns:1fr}
.list .num{grid-row:span 2;font:600 13px var(--mono);color:var(--ink-3);padding-top:4px}
.list a{font:600 1.08rem var(--serif);color:var(--ink);text-decoration:none}
.list a:hover{color:var(--accent);text-decoration:underline}
.list p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.xs-bar .xs-in{max-width:1080px}
body[data-view="list"] main,body[data-view="list"] .xs-bar .xs-in{max-width:820px}

.empty{padding:40px 0;text-align:center;color:var(--ink-3)}
footer{text-align:center;color:var(--ink-3);font-size:14px;padding:40px 20px 60px;border-top:1px solid var(--line);margin-top:40px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main>
  <header class="home-hero">
    <p class="kicker">Interactive explainers</p>
    <h1 id="siteTitle">Explainers</h1>
    <p class="lede" id="siteTagline"></p>
  </header>
  <div class="toolbar">
    <label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.6 10.6l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search topics, e.g. variance" aria-label="Search explainers" autocomplete="off"></label>
    <div class="views" role="group" aria-label="Layout">
      <button type="button" data-view="cards" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2" fill="currentColor"/></svg>Cards</button>
      <button type="button" data-view="list" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="1.5" y="2.5" width="2.5" height="2.5" rx=".6"/><rect x="1.5" y="6.75" width="2.5" height="2.5" rx=".6"/><rect x="1.5" y="11" width="2.5" height="2.5" rx=".6"/><rect x="5.5" y="3" width="9" height="1.6" rx=".8"/><rect x="5.5" y="7.2" width="9" height="1.6" rx=".8"/><rect x="5.5" y="11.4" width="9" height="1.6" rx=".8"/></g></svg>List</button>
    </div>
  </div>
  <nav class="jump" id="jump" aria-label="Categories" hidden></nav>
  <div id="content"></div>
  <p class="empty" id="empty" hidden>No explainers match that search.</p>
</main>
<footer>Every explainer is a single interactive page. The simulations run live in your browser.</footer>
<script src="assets/catalog.js" defer></script>
<script src="assets/site.js" defer></script>
<script src="assets/home.js" defer></script>
</body>
</html>
